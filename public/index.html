<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>TamoLove</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      height: 100%;
      background: #ffe4ec;
      font-family: sans-serif;
      color: #6b2d45;
      overflow: hidden;
      touch-action: none;
    }
    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      align-items: center;
    }
    #top {
      padding: 8px 12px;
      font-size: 16px;
      font-weight: bold;
    }
    #gameWrap {
      flex: 1;
      width: 100%;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      image-rendering: pixelated;
      background: #fff8f0;
      border: 3px solid #6b2d45;
      border-radius: 6px;
      max-width: 100%;
      max-height: 100%;
    }
    #controls {
      display: flex;
      justify-content: center;
      padding: 10px 0 18px;
    }
    #pad {
      display: grid;
      grid-template-columns: repeat(3, 68px);
      grid-template-rows: repeat(2, 68px);
      gap: 6px;
    }
    .btn {
      border: none;
      border-radius: 16px;
      background: #ff8fb1;
      color: white;
      font-size: 30px;
      font-weight: bold;
      user-select: none;
      -webkit-user-select: none;
    }
    .btn:active { background: #e0668f; }
    #up { grid-column: 2; grid-row: 1; }
    #left { grid-column: 1; grid-row: 2; }
    #down { grid-column: 2; grid-row: 2; }
    #right { grid-column: 3; grid-row: 2; }
  </style>
</head>
<body>
  <div id="app">
    <div id="top">❤️ TamoLove — <span id="room">Гостиная</span></div>
    <div id="gameWrap"><canvas id="game"></canvas></div>
    <div id="controls">
      <div id="pad">
        <button class="btn" id="up">▲</button>
        <button class="btn" id="left">◀</button>
        <button class="btn" id="down">▼</button>
        <button class="btn" id="right">▶</button>
      </div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
