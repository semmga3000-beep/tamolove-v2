<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>TamoLove</title>
  <style>
    :root {
      --f1: #b9824f;
      --f2: #8a5a34;
      --f3: #4d2f1a;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      height: 100%;
      background: #ffe4ec;
      font-family: sans-serif;
      color: #6b2d45;
      overflow: hidden;
    }
    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      align-items: center;
      touch-action: none;
    }
    #top {
      width: 100%;
      padding: 6px 10px 4px;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
    }
    #inviteBtn, #themeBtn {
      margin-left: 6px;
      border: none;
      border-radius: 10px;
      background: #ff8fb1;
      color: white;
      font-size: 13px;
      padding: 4px 10px;
    }
    #themeBtn { background: #b79bd1; }

    /* Верхняя панель: показатели и кнопки справа */
    #hud {
      display: flex;
      gap: 6px;
      width: 100%;
      max-width: 520px;
      padding: 0 8px;
    }
    #stats, #partnerInfo {
      background: #fff8f0;
      border: 2px solid #6b2d45;
      border-radius: 10px;
      font-size: 12px;
    }
    #stats { flex: 1.6; padding: 5px 7px; }
    #side { flex: 1; display: flex; flex-direction: column; gap: 6px; }
    #lookBtn {
      border: 2px solid #6b2d45;
      border-radius: 10px;
      background: #ff8fb1;
      color: white;
      font-size: 13px;
      font-weight: bold;
      padding: 8px 4px;
    }
    #lookBtn:active { background: #e0668f; }
    #partnerInfo {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4px;
    }
    .who {
      font-weight: bold;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .line {
      display: flex;
      align-items: center;
      gap: 3px;
      margin: 2px 0 3px;
      font-size: 12px;
    }
    .bar {
      flex: 1;
      height: 9px;
      background: #f3d3de;
      border-radius: 6px;
      overflow: hidden;
    }
    .bar i {
      display: block;
      height: 100%;
      width: 0;
      background: #ff8fb1;
      transition: width 0.4s;
    }
    .bar.low i { background: #e0504f; }

    /* Игровая область в рамке */
    #gameWrap {
      position: relative;
      flex: 1;
      width: 100%;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px 0;
    }
    #frame {
      position: relative;
      padding: 9px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--f1), var(--f2));
      box-shadow:
        0 0 0 2px var(--f3),
        0 5px 0 2px var(--f3),
        0 10px 18px rgba(80, 30, 50, 0.25),
        inset 0 2px 0 rgba(255, 255, 255, 0.35);
    }
    #frame::before, #frame::after {
      content: "❤";
      position: absolute;
      font-size: 16px;
      line-height: 1;
      color: #ff5c8a;
      text-shadow: 0 0 0 #fff, 0 1px 0 rgba(0, 0, 0, 0.3);
      pointer-events: none;
    }
    #frame::before { top: -9px; left: -7px; }
    #frame::after { bottom: -9px; right: -7px; }
    #frame .corner {
      position: absolute;
      font-size: 14px;
      line-height: 1;
      color: #ffd98a;
      pointer-events: none;
    }
    #frame .c1 { top: -8px; right: -6px; }
    #frame .c2 { bottom: -8px; left: -6px; }
    canvas {
      display: block;
      image-rendering: pixelated;
      background: #fff8f0;
      border-radius: 8px;
      box-shadow: 0 0 0 3px var(--f3), 0 0 14px rgba(0, 0, 0, 0.25) inset;
    }
    #toast {
      position: absolute;
      left: 50%;
      top: 12px;
      transform: translateX(-50%);
      background: rgba(107, 45, 69, 0.92);
      color: white;
      font-size: 14px;
      padding: 8px 14px;
      border-radius: 14px;
      max-width: 90%;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }
    #toast.show { opacity: 1; }

    /* Управление */
    #controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 520px;
      padding: 4px 14px 16px;
      padding-bottom: max(16px, env(safe-area-inset-bottom));
    }
    #pad {
      display: grid;
      grid-template-columns: repeat(3, 58px);
      grid-template-rows: repeat(2, 58px);
      gap: 6px;
    }
    #actions {
      display: grid;
      grid-template-columns: repeat(2, 66px);
      grid-template-rows: repeat(2, 66px);
      gap: 6px;
    }
    .btn {
      border: none;
      border-radius: 16px;
      background: #ff8fb1;
      color: white;
      font-size: 28px;
      font-weight: bold;
      user-select: none;
      -webkit-user-select: none;
    }
    .btn:active { background: #e0668f; }
    #up { grid-column: 2; grid-row: 1; }
    #left { grid-column: 1; grid-row: 2; }
    #down { grid-column: 2; grid-row: 2; }
    #right { grid-column: 3; grid-row: 2; }
    .act {
      background: #ff6f91;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.1;
      padding: 2px;
    }
    .act span { font-size: 24px; }
    .act small { font-size: 11px; font-weight: bold; }
    #actBtn { grid-column: 1; grid-row: 1; }
    #emoBtn { grid-column: 2; grid-row: 2; }

    /* Стартовый экран */
    #lobby {
      position: fixed;
      inset: 0;
      background: #ffe4ec;
      overflow-y: auto;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 24px 16px;
      z-index: 10;
    }
    #lobby.hidden { display: none; }
    .card {
      width: 100%;
      max-width: 380px;
      background: #fff8f0;
      border: 3px solid #6b2d45;
      border-radius: 14px;
      padding: 18px;
      text-align: center;
    }
    .card h1 { margin: 0 0 6px; font-size: 32px; }
    .card h2 { margin: 18px 0 8px; font-size: 17px; }
    .card p { margin: 0 0 10px; font-size: 14px; }
    .field {
      width: 100%;
      font-size: 18px;
      padding: 12px;
      border: 2px solid #e0a0b8;
      border-radius: 12px;
      background: white;
      color: #6b2d45;
      text-align: center;
    }
    .row { display: flex; gap: 8px; }
    .role {
      flex: 1;
      border: 2px solid #e0a0b8;
      border-radius: 12px;
      background: white;
      color: #6b2d45;
      font-size: 15px;
      padding: 10px 6px;
    }
    .role.sel { background: #ff8fb1; color: white; border-color: #e0668f; }
    .big {
      width: 100%;
      margin-top: 10px;
      border: none;
      border-radius: 14px;
      background: #ff6f91;
      color: white;
      font-size: 19px;
      font-weight: bold;
      padding: 14px;
    }
    .big:active { background: #e0668f; }
    #lobbyError { color: #c0264f; font-size: 15px; min-height: 20px; margin-top: 10px; }
    hr { border: none; border-top: 2px dashed #e0a0b8; margin: 18px 0 4px; }
  </style>
</head>
<body>
  <div id="app">
    <div id="top">
      ❤️ TamoLove — <span id="room">Гостиная</span>
      · Код: <b id="houseCode">-----</b>
      <button id="inviteBtn">Пригласить</button>
      <button id="themeBtn">🏠 Стиль</button>
    </div>

    <div id="hud">
      <div id="stats">
        <div class="who" id="meName">Я</div>
        <div class="line">
          <span>🍖</span><div class="bar" id="meSat"><i></i></div>
          <span>⚡</span><div class="bar" id="meEne"><i></i></div>
          <span>😊</span><div class="bar" id="meMood"><i></i></div>
        </div>
        <div class="who" id="paName">Партнёр</div>
        <div class="line">
          <span>🍖</span><div class="bar" id="paSat"><i></i></div>
          <span>⚡</span><div class="bar" id="paEne"><i></i></div>
          <span>😊</span><div class="bar" id="paMood"><i></i></div>
        </div>
        <div class="line">
          <span>🧹</span><div class="bar" id="houseClean"><i></i></div>
          <span>🥣</span><div class="bar" id="houseBowl"><i></i></div>
        </div>
      </div>
      <div id="side">
        <button id="lookBtn">Смена внешки</button>
        <div id="partnerInfo">Ждём второго игрока</div>
      </div>
    </div>

    <div id="gameWrap">
      <div id="frame">
        <canvas id="game"></canvas>
        <span class="corner c1">✦</span>
        <span class="corner c2">✦</span>
      </div>
      <div id="toast"></div>
    </div>

    <div id="controls">
      <div id="pad">
        <button class="btn" id="up">▲</button>
        <button class="btn" id="left">◀</button>
        <button class="btn" id="down">▼</button>
        <button class="btn" id="right">▶</button>
      </div>
      <div id="actions">
        <button class="btn act" id="actBtn"><span id="actIcon">✋</span><small id="actLabel">Действие</small></button>
        <button class="btn act" id="emoBtn"><span>❤️</span><small>Сердечко</small></button>
      </div>
    </div>
  </div>

  <div id="lobby">
    <div class="card">
      <h1>❤️ TamoLove</h1>
      <p>Уютный дом для двоих</p>

      <h2>Как тебя зовут?</h2>
      <input class="field" id="nameInput" maxlength="12" placeholder="Твоё имя" autocomplete="off">

      <h2>Создать новый дом</h2>
      <p>Выбери свою роль:</p>
      <div class="row">
        <button class="role sel" id="roleCaregiver">Ведущий</button>
        <button class="role" id="roleReceiver">Ведомый</button>
      </div>
      <button class="big" id="createBtn">Создать дом</button>

      <hr>
      <h2>Войти в дом по коду</h2>
      <p>Вторая роль достанется тебе автоматически.</p>
      <input class="field" id="codeInput" maxlength="5" placeholder="КОД" autocapitalize="characters" autocomplete="off">
      <button class="big" id="joinBtn">Войти</button>

      <div id="lobbyError"></div>
    </div>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="telegram.js"></script>
  <script src="game.js"></script>
  <script src="minigames.js"></script>

</body>
</html>
